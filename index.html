const langs = document.getElementById("langs")
const doc = document.getElementById("doc")

function codeFrom(value) {
	const tag = (value || "").toLowerCase()
	if (tag.startsWith("zh")) return "zh"
	const two = tag.slice(0, 2)
	return ORDER.indexOf(two) >= 0 ? two : ""
}

function current() {
	return codeFrom(location.hash.slice(1)) || codeFrom(navigator.language) || "es"
}

function render(code) {
	const page = TEXT[code]
	document.documentElement.lang = code
	document.title = page.title
	langs.replaceChildren()
	for (const id of ORDER) {
		const button = document.createElement("button")
		button.type = "button"
		button.textContent = NAMES[id]
		button.setAttribute("aria-current", id === code ? "true" : "false")
		button.addEventListener("click", function () {
			history.replaceState(null, "", "#" + id)
			render(id)
		})
		langs.appendChild(button)
	}
	doc.replaceChildren()
	const h1 = document.createElement("h1")
	h1.textContent = page.h1
	doc.appendChild(h1)
	const date = document.createElement("p")
	date.textContent = page.date
	doc.appendChild(date)
	const intro = document.createElement("p")
	intro.textContent = page.intro
	doc.appendChild(intro)
	for (const section of page.sections) {
		const h2 = document.createElement("h2")
		h2.textContent = section[0]
		doc.appendChild(h2)
		for (const block of section[1]) {
			if (Array.isArray(block)) {
				const list = document.createElement("ul")
				for (const item of block) {
					const li = document.createElement("li")
					li.textContent = item
					list.appendChild(li)
				}
				doc.appendChild(list)
			} else {
				const p = document.createElement("p")
				p.textContent = block
				doc.appendChild(p)
			}
		}
	}
	const h2 = document.createElement("h2")
	h2.textContent = page.contact
	doc.appendChild(h2)
	const contact = document.createElement("p")
	contact.append("Nicolás Quiroga")
	contact.append(document.createElement("br"))
	const mail = document.createElement("a")
	mail.href = "mailto:nicoq07@gmail.com"
	mail.textContent = "nicoq07@gmail.com"
	contact.append(mail)
	doc.appendChild(contact)
}

render(current())
